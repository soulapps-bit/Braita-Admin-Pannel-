<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braita | Admin User Management</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #9C27B0; --outer-bg: #212121; --accent: #FFC107; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--outer-bg); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .frame { background: white; width: 100%; max-width: 1000px; min-height: 90vh; border-radius: 8px; overflow: hidden; padding-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .banner { background: var(--primary); color: white; padding: 25px; text-align: center; font-size: 22px; position: relative; font-weight: bold; }
        .btn-back { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); background: #424242; color: white; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .btn-back:hover { background: #000; }
        
        /* Filters Section */
        .controls { padding: 20px 5%; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-user { flex: 1; padding: 12px 20px; border: 1.5px solid #DDD; border-radius: 25px; font-size: 14px; outline: none; transition: 0.3s; }
        .search-user:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(156, 39, 176, 0.2); }
        
        .filter-select { padding: 10px 15px; border-radius: 25px; border: 1.5px solid var(--primary); color: var(--primary); font-weight: bold; cursor: pointer; outline: none; }

        .table-wrap { overflow-x: auto; padding: 0 5%; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f4f4f4; color: #444; padding: 15px; font-size: 12px; text-transform: uppercase; border-bottom: 2px solid var(--primary); }
        td { padding: 15px; text-align: center; font-size: 14px; color: #333; border-bottom: 1px solid #EEE; }
        .user-tag { background: #E1BEE7; color: #7B1FA2; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; font-size: 12px; }
        .points-cell { font-weight: bold; color: var(--primary); }
        .comp-cell { font-weight: bold; color: #2E7D32; background: #E8F5E9; }
        tr:hover td { background: #FDF7FF; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="banner">
            <button class="btn-back" onclick="location.href='Admin.html'">Back</button>
            User Management & Rankings
        </div>

        <div class="controls">
            <input type="text" class="search-user" id="userSearch" onkeyup="filterUsers()" placeholder="🔍 Search Name or UserTag...">
            
            <label style="font-size: 12px; font-weight: bold; color: #666;">SORT BY:</label>
            <select class="filter-select" id="sortFilter" onchange="loadUsers()">
                <option value="MyPoints">All Time Points</option>
                <option value="CompetitionPoints">Current Competition</option>
                <option value="TotalCompletedQuizCount">Quizzes Completed</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>UserTag</th>
                        <th>User Name</th>
                        <th>Lifetime Pts</th>
                        <th>Comp. Pts</th>
                        <th>Correct</th>
                        <th>Wrong</th>
                        <th>Total Quizzes</th>
                    </tr>
                </thead>
                <tbody id="userList">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDOBYUY8CpTN6myiwkQYwO-dPm8Cc24MA8", 
            databaseURL: "https://braita-cf3e7-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function loadUsers() {
            const sortBy = document.getElementById('sortFilter').value;
            const body = document.getElementById('userList');
            
            database.ref('User').on('value', snap => {
                let users = [];
                snap.forEach(child => {
                    users.push({ id: child.key, ...child.val() });
                });

                // Sort based on selected filter (Descending)
                users.sort((a, b) => (b[sortBy] || 0) - (a[sortBy] || 0));

                body.innerHTML = "";
                users.forEach((u, index) => {
                    const rank = index + 1;
                    const rowClass = rank <= 3 ? 'style="background:#FFF9C4"' : ''; // Highlight top 3
                    
                    body.innerHTML += `
                        <tr class="user-row" ${rank <= 1 ? 'style="border-left: 5px solid gold;"' : ''}>
                            <td style="font-weight:bold">#${rank.toString().padLeft(2, '0')}</td>
                            <td><span class="user-tag">${u.UserTag || 'N/A'}</span></td>
                            <td style="text-align:left"><strong>${u.UserName || 'Visitor'}</strong></td>
                            <td class="points-cell">${u.MyPoints || 0}</td>
                            <td class="comp-cell">${u.CompetitionPoints || 0}</td>
                            <td style="color:green">${u.TotalCorrectAnsweredQuizCount || 0}</td>
                            <td style="color:red">${u.TotalWrongAnsweredQuizCount || 0}</td>
                            <td>${u.TotalCompletedQuizCount || 0}</td>
                        </tr>
                    `;
                });
            });
        }

        function filterUsers() {
            const input = document.getElementById('userSearch').value.toLowerCase();
            const rows = document.getElementsByClassName('user-row');
            for(let r of rows) {
                // Filters by both Name and UserTag
                r.style.display = r.innerText.toLowerCase().includes(input) ? "" : "none";
            }
        }

        // Helper for rank padding
        if (!String.prototype.padLeft) {
            String.prototype.padLeft = function(n, str) {
                return Array(n - String(this).length + 1).join(str || '0') + this;
            };
        }

        loadUsers();
    </script>
</body>
</html>
