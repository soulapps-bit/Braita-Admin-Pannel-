<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braita | Manage Quizzes</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #9C27B0; --outer-bg: #212121; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--outer-bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .frame { background: white; width: 100%; max-width: 900px; min-height: 90vh; border-radius: 4px; overflow: hidden; padding-bottom: 50px; }
        .banner { background: var(--primary); color: white; padding: 25px; text-align: center; font-size: 20px; position: relative; font-weight: bold; }
        .btn-back { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); background: #424242; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .content { padding: 30px; }
        .field-group { margin-bottom: 15px; text-align: left; }
        .field-label { font-size: 12px; color: #666; margin-bottom: 5px; display: block; font-weight: 600; padding-left: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #E1BEE7; border-radius: 4px; background: #F3E5F5; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); background: #fff; }
        .search-bar { width: 100%; padding: 12px; border: 2px solid var(--primary); border-radius: 25px; margin: 30px 0; background: white; font-size: 14px; outline: none; text-align: center; }
        
        .table-wrap { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #8E7A8E; color: white; padding: 12px; font-size: 12px; text-transform: uppercase; }
        td { background: #F8F8F8; padding: 12px; text-align: center; border-bottom: 1px solid #EEE; font-size: 13px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .btn-edit { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-delete { background: #F44336; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-submit { background: var(--primary); color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }

        #loading { text-align: center; color: var(--primary); font-weight: bold; padding: 20px; }
        .limit-info { text-align: center; font-size: 11px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="banner"><button class="btn-back" onclick="location.href='Admin.html'">Back</button>Manage Quizzes</div>
        
        <div class="content">
            <div style="text-align:center; color:var(--primary); font-size:16px; font-weight:bold; margin-bottom:20px;">Edit Quiz Question</div>
            
            <div class="field-group"><span class="field-label">Quiz Number (ID)</span><input type="text" id="qKey"></div>
            <div class="field-group"><span class="field-label">Question</span><input type="text" id="qText"></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="field-group"><span class="field-label">Answer 1</span><input type="text" id="ans1"></div>
                <div class="field-group"><span class="field-label">Answer 2</span><input type="text" id="ans2"></div>
                <div class="field-group"><span class="field-label">Answer 3</span><input type="text" id="ans3"></div>
                <div class="field-group"><span class="field-label">Answer 4</span><input type="text" id="ans4"></div>
            </div>
            <div class="field-group"><span class="field-label">Correct Answer Text</span><input type="text" id="correctAns"></div>
            
            <button id="mainBtn" onclick="save()" class="btn-submit">Submit Quiz Changes</button>
            
            <input type="text" class="search-bar" id="search" onkeyup="filter()" placeholder="🔍 Search Quiz ID or Question Text...">
            
            <div id="loading">Connecting to Database...</div>
            <p class="limit-info">Showing the last 50 quizzes to improve performance.</p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>Question Preview</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDOBYUY8CpTN6myiwkQYwO-dPm8Cc24MA8", 
            databaseURL: "https://braita-cf3e7-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 1. Load Quizzes - LIMIT TO LAST 50 to prevent browser crash
        function load() {
            const loader = document.getElementById('loading');
            const body = document.getElementById('list');

            database.ref('Quizzes/Quizzes').limitToLast(50).on('value', snap => {
                body.innerHTML = "";
                loader.style.display = "none";

                if (snap.exists()) {
                    let items = [];
                    snap.forEach(c => {
                        items.push({ key: c.key, ...c.val() });
                    });

                    // Show newest at the top
                    items.reverse();

                    items.forEach(quiz => {
                        body.innerHTML += `
                            <tr class="q-row">
                                <td><strong>${quiz.key}</strong></td>
                                <td style="text-align:left">${quiz.question || 'No Question'}</td>
                                <td>
                                    <button class="btn-edit" onclick="edit('${quiz.key}')">Edit</button>
                                    <button class="btn-delete" onclick="deleteQuiz('${quiz.key}')">Delete</button>
                                </td>
                            </tr>`;
                    });
                } else {
                    body.innerHTML = "<tr><td colspan='3'>No quizzes found.</td></tr>";
                }
            });
        }

        // 2. Pull data for Editing (Fetches specific quiz by ID)
        function edit(key) {
            database.ref('Quizzes/Quizzes/' + key).once('value').then(snap => {
                if (snap.exists()) {
                    const d = snap.val(); 
                    document.getElementById('qKey').value = key; 
                    document.getElementById('qText').value = d.question || "";
                    document.getElementById('correctAns').value = d.correctAnswer || ""; 
                    
                    const answers = d.answers || ["", "", "", ""];
                    document.getElementById('ans1').value = answers[0] || "";
                    document.getElementById('ans2').value = answers[1] || ""; 
                    document.getElementById('ans3').value = answers[2] || "";
                    document.getElementById('ans4').value = answers[3] || ""; 
                    
                    document.getElementById('mainBtn').innerText = "Update Quiz Settings";
                    window.scrollTo({top: 0, behavior: 'smooth'});
                }
            });
        }

        // 3. Delete
        function deleteQuiz(key) {
            if (confirm("Delete " + key + "?")) {
                database.ref('Quizzes/Quizzes/' + key).remove().then(() => alert("Deleted"));
            }
        }

        // 4. Save
        function save() { 
            const key = document.getElementById('qKey').value;
            if (!key) return alert("Select a quiz first");

            const data = { 
                question: document.getElementById('qText').value, 
                correctAnswer: document.getElementById('correctAns').value, 
                answers: [
                    document.getElementById('ans1').value, 
                    document.getElementById('ans2').value, 
                    document.getElementById('ans3').value, 
                    document.getElementById('ans4').value
                ] 
            };

            database.ref('Quizzes/Quizzes/' + key).set(data).then(() => { 
                alert("Updated!"); 
                ['qKey','qText','ans1','ans2','ans3','ans4','correctAns'].forEach(id => document.getElementById(id).value = "");
                document.getElementById('mainBtn').innerText = "Submit Quiz Changes";
            });
        }

        // 5. Client-side Search Filter (Filters within the loaded 50)
        function filter() {
            const input = document.getElementById('search').value.toLowerCase();
            const rows = document.getElementsByClassName('q-row');
            for (let r of rows) { 
                r.style.display = r.innerText.toLowerCase().includes(input) ? "" : "none"; 
            }
        }

        load();
    </script>
</body>
</html>
